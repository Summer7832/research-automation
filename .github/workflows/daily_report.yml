name: 每日研报自动抓取

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装系统依赖（支持PDF中文转换）
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-xetex pandoc fonts-noto-cjk

      - name: 安装 Python 依赖
        run: |
          pip install beautifulsoup4 lxml requests python-dotenv pypdf

      - name: 创建文件夹
        run: |
          mkdir -p data/pdfs
          mkdir -p reports/daily

      - name: 运行爬虫与摘要生成
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python daily_report_fetcher.py

      - name: 提交并推送结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pdfs/ reports/ || true
          git diff --staged --quiet || git commit -m "每日自动更新：研报与摘要 $(date +'%Y-%m-%d')"
          git push
